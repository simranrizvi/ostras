services:
  mongo:
    image: mongo:8
    ports: ['127.0.0.1:27017:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/social-flow
    ports: ['127.0.0.1:4000:4000']
    volumes: ['uploads:/app/backend/uploads']
    depends_on:
      mongo:
        condition: service_healthy
    init: true
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ['node', 'src/worker.js']
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/social-flow
    volumes: ['uploads:/app/backend/uploads']
    depends_on:
      mongo:
        condition: service_healthy
    init: true
    stop_grace_period: 150s
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:4000}
    ports: ['127.0.0.1:3000:3000']
    depends_on: [api]
    init: true
volumes:
  mongo-data:
  uploads:
